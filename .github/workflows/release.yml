name: Desktop releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (for example v0.1.0)'
        required: true
        default: 'v0.1.1'
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate version
        id: version
        env:
          CANDIDATE: ${{ inputs.version || github.ref_name }}
        run: |
          python - <<'PY'
          import os, re
          from build_release import VERSION_PATTERN
          value = os.environ['CANDIDATE']
          if not re.fullmatch(VERSION_PATTERN, value):
              raise SystemExit('Use a version such as v0.1.0')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('version=' + value + '\n')
          PY

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            architecture: x64
            target: windows-x64
          - runner: macos-15
            architecture: arm64
            target: macos-arm64
          - runner: macos-15-intel
            architecture: x64
            target: macos-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Physics and gameplay checks
        run: python check_game.py
      - name: Natural fishing sessions
        run: python natural_play_check.py
      - name: Presentation and input checks
        run: python check_presentation.py
      - name: Water-entry and native fish transparency regressions
        run: python check_regressions.py build/fish-transparency.png
      - name: Build and smoke-test native package
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: python build_release.py --version "$env:RELEASE_VERSION"
        if: runner.os == 'Windows'
      - name: Build and smoke-test native package
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: python build_release.py --version "$RELEASE_VERSION"
        if: runner.os != 'Windows'
      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.target }}
          path: |
            release/*.zip
            release/manifest-*.json
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          merge-multiple: true
          path: release
      - name: Verify packages and publish one complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: python publish_release.py --version "$RELEASE_VERSION" --commit "$GITHUB_SHA"
